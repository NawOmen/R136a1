x-service-logging: &service-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *service-logging
    restart: unless-stopped
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sborka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sborka}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sborka} -d ${POSTGRES_DB:-sborka}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    logging: *service-logging
    restart: unless-stopped
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@demo.ru}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Задайте PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  gateway-auth:
    logging: *service-logging
    restart: unless-stopped
    build:
      context: ../services/gateway-auth
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sborka}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sborka}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.ru}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@demo.ru}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      SEED_SELLER_EMAIL: ${SEED_SELLER_EMAIL:-seller@demo.ru}
      SEED_SELLER_PASSWORD: ${SEED_SELLER_PASSWORD:-}
      SEED_SELLER2_EMAIL: ${SEED_SELLER2_EMAIL:-supplier@demo.ru}
      SEED_SELLER2_PASSWORD: ${SEED_SELLER2_PASSWORD:-${SEED_SELLER_PASSWORD:-}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:${GATEWAY_AUTH_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    logging: *service-logging
    restart: unless-stopped
    build:
      context: ./minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Задайте MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  optimizer:
    logging: *service-logging
    restart: unless-stopped
    build:
      context: ../services/optimizer
    environment:
      OPTIMIZER_TOKEN: ${OPTIMIZER_TOKEN:?Задайте OPTIMIZER_TOKEN}
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  marketplace:
    logging: *service-logging
    restart: unless-stopped
    build:
      context: ../services/marketplace
    environment:
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sborka}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sborka}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Задайте MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-sborka}
      OPTIMIZER_URL: http://optimizer:8004
      OPTIMIZER_TOKEN: ${OPTIMIZER_TOKEN:?Задайте OPTIMIZER_TOKEN}
      ENABLE_DEMO_SEED: ${ENABLE_DEMO_SEED:-false}
      SEED_SELLER_EMAIL: ${SEED_SELLER_EMAIL:-seller@demo.ru}
      SEED_SELLER_STORIES: ${SEED_SELLER_STORIES:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "127.0.0.1:${MARKETPLACE_PORT:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      gateway-auth:
        condition: service_healthy
      minio:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  llm-gateway:
    logging: *service-logging
    restart: unless-stopped
    build:
      context: ../services/llm-gateway
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sborka}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sborka}
      BUYER_TRIAL_ENABLED: ${BUYER_TRIAL_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      # Рабочий режим — обученная модель через нативный MLX-сервер (host:8080).
      LOCAL_LLM_BACKEND: ${LOCAL_LLM_BACKEND:-mlx}
      MLX_BASE_URL: ${MLX_BASE_URL:-http://host.docker.internal:8080}
      TRAINED_MODEL_VERSION: ${TRAINED_MODEL_VERSION:-porukam-buyer-qwen3.5}
      # Справка, объяснения и черновики переписки — общая модель: адаптер обучен извлечению фактов.
      ASSISTANT_LLM_BACKEND: ${ASSISTANT_LLM_BACKEND:-ollama}
      MLX_MAX_TOKENS: ${MLX_MAX_TOKENS:-640}
      MLX_TIMEOUT_SECONDS: ${MLX_TIMEOUT_SECONDS:-180}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3.5:9b}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-8192}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - whisper_cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:${LLM_GATEWAY_PORT:-8003}:8003"
    depends_on:
      postgres:
        condition: service_healthy
      gateway-auth:
        condition: service_healthy
      marketplace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    logging: *service-logging
    restart: unless-stopped
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_MARKETPLACE_URL: http://localhost:8002
      NEXT_PUBLIC_LLM_GATEWAY_URL: http://localhost:8003
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      gateway-auth:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
  whisper_cache:
