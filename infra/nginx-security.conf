limit_req_zone $binary_remote_addr zone=auth_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=web_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;

server {
    listen 80;
    server_name _;
    # Do not reflect an untrusted Host into a redirect; require HTTPS explicitly.
    return 400 "Используйте HTTPS.\n";
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 26m;
    client_body_timeout 15s;
    limit_conn connections 20;
    limit_req_status 429;
    # Request URLs may contain sensitive query parameters: no access log.
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    proxy_set_header Host $host;
    # Application deliberately uses direct peer for its additional global cap.
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 240s;
    location ~ ^/gateway/api/v1/auth/(login|register)$ {
        limit_req zone=auth_ip burst=5 nodelay;
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass http://gateway-auth:8001;
    }
    location /gateway/ {
        limit_req zone=api_ip burst=30 nodelay;
        proxy_pass http://gateway-auth:8001/;
    }
    location /marketplace/ {
        limit_req zone=api_ip burst=30 nodelay;
        proxy_pass http://marketplace:8002/;
    }
    location /llm/ {
        # Up to 100 MiB of files plus multipart metadata. Per-file checks stay in the API.
        client_max_body_size 105m;
        limit_req zone=api_ip burst=10 nodelay;
        proxy_pass http://llm-gateway:8003/;
    }
    location ^~ /_next/static/ {
        # Fingerprinted build assets do not consume API or page-request quotas.
        proxy_pass http://web:3000;
    }
    location / {
        limit_req zone=web_ip burst=100 nodelay;
        proxy_pass http://web:3000;
    }
}
