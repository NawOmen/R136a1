# Use with the base Compose file. TLS key/certificate must exist outside Git.
services:
  edge:
    image: nginx:stable-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx-security.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Задайте абсолютный каталог TLS_CERT_DIR}:/etc/nginx/tls:ro
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
