version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: pip
    directories:
      - /services/gateway-auth
      - /services/marketplace
      - /services/llm-gateway
      - /services/optimizer
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories:
      - /apps/web
      - /services/gateway-auth
      - /services/marketplace
      - /services/llm-gateway
      - /services/optimizer
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
