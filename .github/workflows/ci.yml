name: CI

on:
  push:
    branches: [main, assweg]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: sborka
          POSTGRES_PASSWORD: sborka
          POSTGRES_DB: sborka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sborka -d sborka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Ephemeral service keys for this job
        run: |
          python - <<'PY'
          import os, secrets
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              for name in ("JWT_SECRET", "OPTIMIZER_TOKEN", "MINIO_SECRET_KEY"):
                  stream.write(f"{name}={secrets.token_urlsafe(48)}\n")
          PY
      - name: Install dependencies in isolated service environments
        run: |
          for service_name in gateway-auth marketplace llm-gateway optimizer; do
            service_venv="$RUNNER_TEMP/venv-$service_name"
            python -m venv "$service_venv"
            "$service_venv/bin/python" -m pip install "pytest>=9.1.1,<10" "pytest-asyncio>=1.4.0,<2" "httpx>=0.28.1,<1"
            "$service_venv/bin/python" -m pip install --require-hashes -r "services/$service_name/requirements.lock"
            "$service_venv/bin/python" -m pip check
          done
      - name: Restore safety and acceptance map
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/acceptance-report.py > "$RUNNER_TEMP/acceptance-unverified.json"
          python3 scripts/business_analysis.py --markdown > "$RUNNER_TEMP/stage-16-scenarios.md"
          diff -u docs/analysis/stage-16-scenarios.md "$RUNNER_TEMP/stage-16-scenarios.md"
      - name: Contest evidence guards and scenario economics
        run: >-
          python3 scripts/run_evidence_tests.py --service scripts
          --python "$RUNNER_TEMP/venv-marketplace/bin/python" --junit "$RUNNER_TEMP/scripts.xml" --
          scripts/test_business_analysis.py scripts/test_contest_evidence.py
      - name: Subject profiles and guards for all catalogue leaves
        working-directory: services/marketplace
        run: >-
          "$RUNNER_TEMP/venv-marketplace/bin/python" -m unittest
          unit.test_category_registry unit.test_category_admission_registry
          unit.test_category_characteristics unit.test_category_stage_acceptance
      - name: Verify migrations (gateway-auth)
        working-directory: services/gateway-auth
        env:
          DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: '"$RUNNER_TEMP/venv-gateway-auth/bin/alembic" upgrade head'
      - name: Verify migrations (marketplace)
        working-directory: services/marketplace
        env:
          DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: '"$RUNNER_TEMP/venv-marketplace/bin/alembic" upgrade head'
      - name: Verify migrations (llm-gateway)
        working-directory: services/llm-gateway
        env:
          DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: '"$RUNNER_TEMP/venv-llm-gateway/bin/alembic" upgrade head'
      - name: Run gateway-auth tests
        working-directory: services/gateway-auth
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: '"$RUNNER_TEMP/venv-gateway-auth/bin/python" -m pytest -q'
      - name: Run marketplace tests
        working-directory: services/marketplace
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: 'python3 "$GITHUB_WORKSPACE/scripts/run_evidence_tests.py" --service marketplace --python "$RUNNER_TEMP/venv-marketplace/bin/python" --junit "$RUNNER_TEMP/marketplace.xml"'
      - name: Run llm-gateway tests
        working-directory: services/llm-gateway
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
          STAGE17_TRACE_PATH: ${{ runner.temp }}/stage17-trace.json
        run: 'python3 "$GITHUB_WORKSPACE/scripts/run_evidence_tests.py" --service llm-gateway --python "$RUNNER_TEMP/venv-llm-gateway/bin/python" --junit "$RUNNER_TEMP/llm-gateway.xml"'
      - name: Run optimizer tests
        working-directory: services/optimizer
        run: '"$RUNNER_TEMP/venv-optimizer/bin/python" -m pytest -q'
      - name: Verify automated K1-K4 evidence without closing manual readiness
        run: >-
          python3 scripts/contest_evidence.py
          "$RUNNER_TEMP/scripts.xml" "$RUNNER_TEMP/marketplace.xml" "$RUNNER_TEMP/llm-gateway.xml"
          --require K1 K2 K3 K4 > "$RUNNER_TEMP/stage17-verification.json"
      - name: Linux container runner and real PNG decoder
        run: >-
          python3 scripts/test-backend.py --service marketplace -- -q
          tests/test_stage5_supplier.py::test_product_characteristics_limit_and_photo_bounds
      - name: Publish sanitized stage 17 evidence for the tested commit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage17-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/stage17-trace.json
            ${{ runner.temp }}/stage17-verification.json
          if-no-files-found: error
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @sborka/web lint
      - name: API client regression
        working-directory: tests/e2e
        run: pnpm exec playwright test --config api-client.config.ts
      - name: Check Russian UI
        run: python3 scripts/check-russian-ui.py
      - name: Check generated category registry
        run: python3 scripts/sync_category_registry.py --check
      - name: Build
        run: pnpm build:web
      - name: Install browser for requirement acceptance checks
        working-directory: tests/e2e
        run: pnpm exec playwright install --with-deps chromium --only-shell
      - name: Requirement draft browser acceptance
        working-directory: tests/e2e
        run: pnpm exec playwright test --config requirements-browser.config.ts
      - name: Build web Docker image
        run: docker build --file apps/web/Dockerfile --tag porukam-web:ci .
