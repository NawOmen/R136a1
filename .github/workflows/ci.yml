name: CI

on:
  push:
    branches: [main, assweg]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sborka
          POSTGRES_PASSWORD: sborka
          POSTGRES_DB: sborka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sborka -d sborka_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r services/gateway-auth/requirements-dev.txt
          pip install -r services/marketplace/requirements-dev.txt
          pip install -r services/llm-gateway/requirements-dev.txt
      - name: Verify migrations (gateway-auth)
        working-directory: services/gateway-auth
        env:
          DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: alembic upgrade head
      - name: Verify migrations (marketplace)
        working-directory: services/marketplace
        env:
          DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: alembic upgrade head
      - name: Verify migrations (llm-gateway)
        working-directory: services/llm-gateway
        env:
          DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: alembic upgrade head
      - name: Run gateway-auth tests
        working-directory: services/gateway-auth
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: pytest -q
      - name: Run marketplace tests
        working-directory: services/marketplace
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: pytest -q
      - name: Run llm-gateway tests
        working-directory: services/llm-gateway
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://sborka:sborka@localhost:5432/sborka_test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm --filter @sborka/web lint
      - name: Build
        run: pnpm build:web
