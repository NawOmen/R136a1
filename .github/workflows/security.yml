name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/security-config-smoke.py
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install bandit==1.9.4
      - run: bandit -r services/gateway-auth/app services/marketplace/app services/llm-gateway/app services/optimizer/app -ll
  python-dependencies:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway-auth, marketplace, llm-gateway, optimizer]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip -r services/${{ matrix.service }}/requirements.lock
  javascript-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: {version: 10.28.1}
      - uses: actions/setup-node@v7
        with: {node-version: "26"}
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=moderate
